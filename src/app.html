<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#f2f6f9" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#08111a" media="(prefers-color-scheme: dark)" />
		<script>
			(() => {
				const key = 'sveltegram-theme';
				try {
					const saved = localStorage.getItem(key);
					const dark =
						saved === 'dark' ||
						(saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
					document.documentElement.classList.toggle('dark', dark);
				} catch {
					// Storage can be unavailable; the site still works with the light theme.
				}
			})();
		</script>
		<meta name="twitter:title" content="Sveltegram" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:site" content="@amr3k_" />
		<meta name="twitter:creator" content="@amr3k_" />
		<meta
			name="twitter:image:alt"
			content="Drawing of flying envelope in Red circle, and next to it the word 'Sveltegram'."
		/>
		<meta property="og:title" content="Sveltegram" />
		<meta
			property="og:description"
			content="Reactive Telegram widgets built with svelte, built with love and by Amr K. a3k.me"
		/>
		<meta property="og:image" content="https://sveltegram.a3k.me/og.png" />
		<meta property="og:image:type" content="image/png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="675" />
		<meta
			property="og:image:alt"
			content="Drawing of flying envelope in Red circle, and next to it the word 'Sveltegram'."
		/>
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Sveltegram." />
		<meta name="author" content="Amr." />
		%sveltekit.head%
	</head>

	<body>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
